name: Verify and publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification and site dependencies
        run: python -m pip install 'numpy>=2.0,<3' 'sympy>=1.13,<2' 'Markdown>=3.7,<4'
      - name: Verify finite mathematical certificates
        run: python scripts/verify.py --receipt /tmp/verification.json
      - name: Build static pages
        run: python scripts/build_site.py
      - name: Check site links and media presence
        run: python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
